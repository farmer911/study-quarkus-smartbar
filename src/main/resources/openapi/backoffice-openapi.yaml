openapi: 3.1.0
info:
  title: Smartbar Backoffice AP
  description: Smartbar Backoffice AP 
  version: 1.0.0
paths:
  /categories:
    get:
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/category'
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/category'
      responses:
        201:
          $ref: '#/components/responses/201'
  /categories/{categoryId}:
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/category'
      responses:
        200:
          description: Entity successfully updated
    delete:
      responses:
        200:
          description: Entity successfully deleted
    get:
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/category'
#  /articles:
#  /articles/{articleId}:
#  /tables:
#  /tables/{tableId}:
components:
  schemas:
    category:
      type: object
      properties:
        name:
          type: string
        description:
              type: string
    article:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        description:
          type: string
        picture:
          type: string

  responses:
    201:
      description: OK
      headers:
        Location:
          description: Entity successfully created
          schema:
            type: string